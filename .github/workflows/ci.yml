# CI — chạy trên GitHub-hosted runner (repo PUBLIC → không dùng self-hosted runner).
# deploy.sh trên máy chủ chỉ deploy sha của main khi workflow này (file ci.yml) đã "success"
# trên đúng sha đó (đọc qua GitHub API công khai, không token).
#
# Không gọi OpenAI/Tavily: test dùng bản giả (tests/conftest.py), HF_HUB_OFFLINE=1.
# Action ghim theo commit SHA (chú thích là tag tương ứng).

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TORCH_VERSION: "2.11.0"

jobs:
  backend-test:
    name: backend · pytest (torch CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock.txt
      - name: Cài torch CPU (giống Dockerfile --build-arg TORCH_VARIANT=cpu)
        run: pip install --index-url https://download.pytorch.org/whl/cpu "torch==${TORCH_VERSION}+cpu"
      - name: Cài requirements (ghim bằng lock)
        run: pip install -r requirements.txt -c requirements.lock.txt
      - name: pytest
        run: python -m pytest -rs

  frontend:
    name: frontend · lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  docker-build:
    name: docker · build thử 2 image (backend CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build backend (CPU)
        run: docker build --build-arg TORCH_VARIANT=cpu -t chatbot-backend:ci .
      - name: Smoke test image backend
        run: |
          docker run --rm chatbot-backend:ci python -c "import torch, transformers, fastapi, pymilvus; print('torch', torch.__version__)"
          test "$(docker inspect -f '{{.Config.User}}' chatbot-backend:ci)" = app
      - name: Build frontend
        run: docker build -t chatbot-frontend:ci frontend

  gitleaks:
    name: gitleaks · quét commit mới
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Cài gitleaks 8.30.1 (kiểm sha256)
        run: |
          v=8.30.1
          f=gitleaks_${v}_linux_x64.tar.gz
          curl -fsSL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${v}/${f}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Quét
        # Chỉ quét commit của lần push/PR này: lịch sử cũ (nhánh win) có khoá đã lộ — xem
        # docs/deploy/SURVEY.md mục 9; quét toàn bộ sẽ luôn đỏ. --redact: không in giá trị.
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$BASE..$HEAD"
          elif [ -n "$BEFORE" ] && ! printf '%s' "$BEFORE" | grep -qE '^0+$'; then
            range="$BEFORE..$HEAD"
          else
            range="$HEAD~1..$HEAD"
          fi
          echo "Phạm vi quét: $range"
          gitleaks git --redact --no-banner --log-opts="$range" .
