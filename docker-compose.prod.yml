# Production stack — chạy trong WSL2 (Docker Engine, không phải Docker Desktop).
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# LUÔN truyền --env-file .env.prod: nếu thiếu, compose đọc .env (bản dev ở gốc repo).
# Không publish cổng nào ra host. Truy cập từ ngoài chỉ qua Cloudflare Tunnel (cloudflared).
# Debug cục bộ: thêm -f docker-compose.debug.yml (bind 127.0.0.1).
#
# Mạng:
#   data — internal (không ra Internet): mysql, neo4j, etcd, minio, milvus + backend
#   app  — có Internet: backend (OpenAI, Tavily, Mongo Atlas, HF), frontend (Mongo Atlas), cloudflared
#
# Biến bắt buộc khai báo dạng ${VAR:?…} → `docker compose config` báo thiếu mà không in giá trị.

name: chatbot

x-restart: &restart
  restart: unless-stopped

services:
  # ── Dữ liệu ──────────────────────────────────────────────────────────────────
  mysql:
    <<: *restart
    image: mysql:9.6.0          # đúng bản dump trên máy Mac (SURVEY mục 3)
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?thiếu MYSQL_ROOT_PASSWORD trong .env.prod}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-law}
      MYSQL_USER: ${MYSQL_USER:-law_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?thiếu MYSQL_PASSWORD trong .env.prod}
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [data]
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  neo4j:
    <<: *restart
    image: neo4j:5.26.24-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?thiếu NEO4J_PASSWORD trong .env.prod}
      NEO4J_server_memory_heap_initial__size: 2G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1536M
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks: [data]
    mem_limit: 4608m
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  etcd:
    <<: *restart
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd
    networks: [data]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  minio:
    <<: *restart
    # minio/minio:RELEASE.2023-03-20T20-16-18Z (SURVEY) không còn tải được bản amd64 (Docker Hub
    # chặn repo, quay.io đòi đăng nhập; bản copy từ Mac là arm64). Dùng bản Bitnami cùng đợt
    # phát hành — kho bitnamilegacy không còn cập nhật; MinIO chỉ ở mạng internal "data".
    image: bitnamilegacy/minio:2023.3.20
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?thiếu MINIO_ROOT_USER trong .env.prod}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?thiếu MINIO_ROOT_PASSWORD trong .env.prod}
    volumes:
      - minio_data:/bitnami/minio/data
    networks: [data]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  milvus:
    <<: *restart
    image: milvusdb/milvus:v2.4.14
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined       # theo compose chính thức của Milvus
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      # Milvus đọc env ghi đè milvus.yaml: MINIO_ACCESSKEYID → minio.accessKeyID …
      MINIO_ACCESSKEYID: ${MINIO_ROOT_USER:?thiếu MINIO_ROOT_USER trong .env.prod}
      MINIO_SECRETACCESSKEY: ${MINIO_ROOT_PASSWORD:?thiếu MINIO_ROOT_PASSWORD trong .env.prod}
    volumes:
      - milvus_data:/var/lib/milvus
    networks: [data]
    mem_limit: 4g
    depends_on:
      etcd: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  # ── Ứng dụng ─────────────────────────────────────────────────────────────────
  backend:
    <<: *restart
    build:
      context: .
      args:
        TORCH_VARIANT: ${TORCH_VARIANT:-cu128}
    image: chatbot-backend:${IMAGE_TAG:-local}
    environment:
      # Kết nối nội bộ (tên service trong mạng data)
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-law_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?thiếu MYSQL_PASSWORD trong .env.prod}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-law}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?thiếu NEO4J_PASSWORD trong .env.prod}
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      FIREBASE_CRED_PATH: /run/secrets/firebase-credentials.json
      # Bắt buộc
      OPENAI_API_KEY: ${OPENAI_API_KEY:?thiếu OPENAI_API_KEY trong .env.prod}
      OPENAI_MODEL: ${OPENAI_MODEL:?thiếu OPENAI_MODEL trong .env.prod}
      OPENAI_AGENT_MODEL: ${OPENAI_AGENT_MODEL:?thiếu OPENAI_AGENT_MODEL trong .env.prod}
      TAVILY_API_KEY: ${TAVILY_API_KEY:?thiếu TAVILY_API_KEY trong .env.prod}
      MONGODB_URI: ${MONGODB_URI:?thiếu MONGODB_URI trong .env.prod}
      MONGODB_DB: ${MONGODB_DB:?thiếu MONGODB_DB trong .env.prod}
      MONGODB_COLLECTION: ${MONGODB_COLLECTION:?thiếu MONGODB_COLLECTION trong .env.prod}
      FIREBASE_STORAGE_BUCKET:
      # Tuỳ chọn — khoá không giá trị: chỉ truyền khi có trong .env.prod, nếu không thì
      # code dùng mặc định (không ghi đè bằng chuỗi rỗng, vd int("") sẽ lỗi).
      DAILY_QUESTION_CAP:
      RATE_LIMIT_QUESTION_USER:
      RATE_LIMIT_QUESTION_IP:
      RATE_LIMIT_TTS_USER:
      RATE_LIMIT_TTS_IP:
      RATE_LIMIT_STT_USER:
      RATE_LIMIT_STT_IP:
      RATE_LIMIT_TITLE_USER:
      RATE_LIMIT_TITLE_IP:
      SENTIMENT_DEVICE:
      SSE_HEARTBEAT_SECONDS:
      HEALTH_TIMEOUT_SECONDS:
      MONGODB_TIMEOUT_MS:
      CHAT_TITLE_MODEL:
      DOC_REVIEW_MODEL:
      DOC_REVIEW_COLLECTION:
      DOC_REVIEW_FILES_BUCKET:
      DOC_REVIEW_MAX_CHARS:
      DOC_REVIEW_MAX_RISKS:
      DOC_REVIEW_WEB:
      MEMORY_ENABLED:
      MEMORY_DEFAULT_MODE:
      MEMORY_EXTRACT_MODEL:
      MEMORY_UPDATE_MODEL:
      MEMORY_MONGO_COLLECTION:
      MEMORY_SETTINGS_COLLECTION:
      MEMORY_TOP_K:
      MEMORY_MIN_SIMILARITY:
      MEMORY_RECENCY_WEIGHT:
      MEMORY_EPISODIC_TTL_DAYS:
      MEMORY_EPISODIC_HALF_LIFE_DAYS:
      MEMORY_SEMANTIC_HALF_LIFE_DAYS:
      ROLES_COLLECTION:
      CACHE_SCAN_LIMIT:
      CACHE_SIMILARITY_THRESHOLD:
      CACHE_TTL_SECONDS:
      RRF_W_VECTOR:
      RERANK_LEX_WEIGHT:
      RAG_AGENT_LLM_RERANK:
      BM25_SPLIT_LONG:
      GRAPH_W_DAN_CHIEU:
      GRAPH_W_DAN_CHIEU_2:
      GRAPH_W_DUOC_DAN_CHIEU:
      GRAPH_W_LIEN_QUAN:
      AGENT_AUTO_WEB_VERIFY:
      AGENT_WEB_VERIFY_SCORE:
      AGENT_EXCEPTION_CHECK:
      AGENT_EXCEPTION_MAX:
      AGENT_EXCEPTION_SEEDS:
      AGENT_LLM_MAX_NOIDUNG_CHARS:
      AGENT_LLM_MAX_PASSAGE_CHARS:
      AGENT_LLM_MAX_WEB_CHARS:
      AGENT_REF_CLOSURE:
      AGENT_REF_CLOSURE_CHARS:
      AGENT_REF_CLOSURE_MAX:
      AGENT_REF_CLOSURE_SEEDS:
      AGENT_STREAM_HOLD_CHARS:
      AGENT_VECTOR_POOL_MULT:
      EXC_GEN_MODEL:
      EXC_JUDGE_MODEL:
      JUDGE_MODEL:
    volumes:
      - hf_cache:/data/hf
      - bm25_cache:/data/bm25
      - lawdata:/data/lawdata
      # deploy.sh đặt FIREBASE_CRED_FILE = đường dẫn tuyệt đối (repo deploy là bản clone riêng).
      - ${FIREBASE_CRED_FILE:-./firebase-credentials.json}:/run/secrets/firebase-credentials.json:ro
    # firebase-credentials.json: chủ deploy, mode 640 → user app (uid 10001) đọc qua group.
    group_add:
      - "${FIREBASE_CRED_GID:-1001}"
    networks: [data, app]
    mem_limit: 6g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      mysql: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      milvus: { condition: service_healthy }

  frontend:
    <<: *restart
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:?thiếu NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:?thiếu NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:?thiếu NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:?thiếu NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:?thiếu NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:?thiếu NEXT_PUBLIC_FIREBASE_APP_ID}
        NEXT_PUBLIC_OFFICE_DATA: ${NEXT_PUBLIC_OFFICE_DATA:-}
    image: chatbot-frontend:${IMAGE_TAG:-local}
    environment:
      RAG_BACKEND_URL: http://backend:8001
      MONGODB_URI: ${MONGODB_URI:?thiếu MONGODB_URI trong .env.prod}
      MONGODB_DB: ${MONGODB_DB:?thiếu MONGODB_DB trong .env.prod}
      MONGODB_COLLECTION: ${MONGODB_COLLECTION:?thiếu MONGODB_COLLECTION trong .env.prod}
    networks: [app]
    mem_limit: 768m
    depends_on:
      backend: { condition: service_started }

  cloudflared:
    <<: *restart
    image: cloudflare/cloudflared:2026.10.7
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?thiếu CLOUDFLARE_TUNNEL_TOKEN trong .env.prod}
      TUNNEL_METRICS: 0.0.0.0:2000   # /ready cho deploy.sh kiểm từ trong mạng app
    networks: [app]
    mem_limit: 256m
    depends_on:
      frontend: { condition: service_started }

networks:
  data:
    internal: true
  app: {}

volumes:
  mysql_data:
  neo4j_data:
  neo4j_logs:
  etcd_data:
  minio_data:
  milvus_data:
  hf_cache:
  bm25_cache:
  lawdata:
